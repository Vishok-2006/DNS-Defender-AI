# DNS Defender AI - resolver configuration (container-safe).
#
# NOTE: no interface=/listen-address= lines on purpose. Inside a container the
# LAN address does not exist, and dnsmasq refuses to start if asked to bind it.
# Restrict who can reach port 53 with the HOST firewall (see scripts/setup-raspberrypi.sh).
no-resolv                 # upstream servers come from DNS_UPSTREAM_SERVERS (see entrypoint.sh)
cache-size=1000
dns-forward-max=500

# (port and log file are set by entrypoint.sh so DNS_LISTEN_PORT works; a port= line here would override it)
# Query log consumed by the backend
log-queries
log-async=25

# Health probe name, answered locally so the healthcheck never needs the internet
address=/health.check.local/127.0.0.1
